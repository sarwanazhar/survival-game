name: "Build Android APK"

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  export_android:
    name: "Export Android Debug APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android Build Tools"
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: "Setup Godot"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: "Export Android APK"
        run: |
          mkdir -p ~/.local/share/godot/keystores
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p builds
          godot --headless --export-debug "Android" builds/island_survival.apk

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Island-Survival-Android-APK
          path: builds/island_survival.apk
