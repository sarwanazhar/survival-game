name: "Build Android APK"

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  export_android:
    name: "Export Android Debug APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Verify Pre-installed Android SDK & Licenses"
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          else
            echo "Using pre-installed Android SDK at $SDK_ROOT"
          fi

      - name: "Setup Godot 4.6.1"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: "Generate Debug Keystore & Configure Godot Android SDK"
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" builds
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android             -keystore "$HOME/.local/share/godot/keystores/debug.keystore"             -storepass android -dname "CN=Android Debug,O=Android,C=US"             -validity 9999 -deststoretype pkcs12 -noprompt

          cat <<EOF > "$HOME/.config/godot/editor_settings-4.6.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: "Import Project Assets & Export Android Debug APK"
        run: |
          godot --headless --import --quit || true
          godot --headless --export-debug "Android" builds/island_survival.apk
          ls -lh builds/island_survival.apk

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Island-Survival-Android-APK
          path: builds/island_survival.apk
